# Mosquitto 2.x broker for the compose stack (compose.yaml, D47). Adapted from habitat.conf:
# the same listener and password check, with the container's paths. compose.yaml copies the
# operator's hub/mosquitto/passwd to /mosquitto/config/passwd when the container starts.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
