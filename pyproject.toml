[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat"
version = "0.1.0"
description = "Offline habitat health monitor: hub, link simulator and ground receiver"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "aiomqtt",
  "paho-mqtt>=2",
  "pyserial",
  "httpx",
  "lightstreamer-client-lib==2.2.3",
  "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "respx", "pytest-asyncio", "segno"]
analysis = ["matplotlib", "numpy"]
pi = ["smbus2"]  # cabin node on a Raspberry Pi (MIT)
cloud = ["upstash-redis"]  # public ground segment (MIT)
labels = ["segno"]  # printable food pack QR labels, tools/food/qr_labels.py (BSD-3-Clause)

[tool.setuptools.packages.find]
where = [".", "ground"]
include = ["hub*", "linksim*", "receiver*", "nodes*"]

[tool.pytest.ini_options]
testpaths = ["hub/tests", "nodes/cabin_pi/tests", "nodes/ring/tests", "linksim/tests", "tools/food/tests", "tools/tests", "ground/receiver/tests"]
pythonpath = ["ground"]
markers = ["broker: needs a throwaway Mosquitto named by HUB_TEST_BROKER_PORT (never the bench broker on 1883)"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
