name: CI

# Offline tests for the hub, the web apps and the firmware. No secrets, no hardware, no bench broker.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,analysis]'
      - run: ruff check .
      # The firmware host tests inside pytest skip here (no ArduinoJson); the firmware job runs them.
      - run: pytest -m 'not broker' -q
      # A throwaway broker on its own port: the broker test refuses 1883 by design.
      - name: Broker round trip (throwaway Mosquitto)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mosquitto mosquitto-clients
          mosquitto -p 18830 -d
          sleep 1
          HUB_TEST_BROKER_PORT=18830 pytest -m broker -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [console, camera, ground]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # Build first: the offline tests read dist/.
      - run: npm run build
        if: matrix.app != 'ground'
      - run: npx vitest run

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://arduino.esp8266.com/stable/package_esp8266com_index.json
      ARDUINOJSON_SRC: /home/runner/Arduino/libraries/ArduinoJson/src
      SPARKFUN_SRC: /home/runner/Arduino/libraries/SparkFun_MAX3010x_Pulse_and_Proximity_Sensor_Library/src
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
            ~/Arduino/libraries
          key: arduino-avr188-esp8266312-${{ hashFiles('firmware/**/libraries.txt', '.github/workflows/ci.yml') }}
      - name: Cores and libraries (pinned, see firmware/README.md)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8 esp8266:esp8266@3.1.2
          arduino-cli lib install "ArduinoJson@7.4.3" "MQTT@2.5.3" "DHT sensor library@1.4.7" \
            "Adafruit Unified Sensor@1.1.15" "SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2"
      - name: HabitatNode library host tests (every test/test_*.cpp)
        run: |
          H=firmware/libraries/HabitatNode
          mkdir -p firmware/build
          for t in $H/test/test_*.cpp; do
            n=$(basename "$t" .cpp)
            echo "== $n"
            c++ -std=c++17 -Wall -Werror -I $H/src -I "$ARDUINOJSON_SRC" $H/src/ReadingFormat.cpp "$t" -o "firmware/build/$n"
            "firmware/build/$n"
          done
      - name: Sketch host tests
        run: |
          firmware/exercise-uno/test/run_host_tests.sh
          firmware/tilt-esp8266/test/run_host_tests.sh
          firmware/vitals-esp32/test/run_host_tests.sh
          firmware/bmp280/test/run_host_tests.sh
          firmware/bmp280/check_sync.sh
      - name: Wokwi chip tests and copy checks
        run: |
          firmware/wokwi/full-bench/test/run_chip_tests.sh
          firmware/wokwi/vitals-esp32/test/run_chip_tests.sh
          for s in firmware/wokwi/*/check_sync.sh; do "$s"; done
      - name: Compile the UNO sketch (D40 defaults) and its Wokwi twin
        run: |
          arduino-cli compile --fqbn arduino:avr:uno firmware/exercise-uno
          firmware/wokwi/uno-rig/build.sh
      - name: Compile the tilt-1 sketch for the NodeMCU, with the example secrets
        run: |
          cp firmware/tilt-esp8266/secrets.example.h firmware/tilt-esp8266/secrets.h
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --library firmware/libraries/HabitatNode firmware/tilt-esp8266

  # D47: the image and the compose stack. Nothing is pushed to any registry.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST_HUB_PORT: "18000"
      HOST_BROKER_PORT: "18830"
      HOST_LINKSIM_PORT: "18200"
      HOST_RECEIVER_PORT: "18100"
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t habitat-health-monitor:local .
      # A throwaway broker password and .env, made here and gone with the runner.
      - name: Throwaway broker password and .env
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/hub/mosquitto:/work" eclipse-mosquitto:2 \
            mosquitto_passwd -b -c /work/passwd habitat "$pw"
          ( umask 077 && printf 'HUB_MQTT_USER=habitat\nHUB_MQTT_PASS=%s\nDONKI_MODE=replay\n' "$pw" > .env )
      - name: Start the stack with the sim profile (synthetic data)
        run: docker compose -p habitat-ci --profile sim up -d
      - name: Hub, linksim and receiver answer
        run: |
          for url in http://127.0.0.1:18000/api/status http://127.0.0.1:18200/link/state \
                     http://127.0.0.1:18100/ground/summary; do
            for _ in $(seq 1 60); do curl -fsS "$url" >/dev/null 2>&1 && break; sleep 2; done
            curl -fsS "$url" >/dev/null || { echo "no answer from $url"; exit 1; }
            echo "ok $url"
          done
      - name: The hub stored sim-1 readings, the broker took its login, the receiver got items
        run: |
          count() { curl -fsS "$1" 2>/dev/null | python3 -c "$2" 2>/dev/null || echo 0; }
          for _ in $(seq 1 30); do
            n=$(count 'http://127.0.0.1:18000/api/readings?ind=cabin_temp&limit=50' \
              'import json,sys; print(sum(r["node"] == "sim-1" for r in json.load(sys.stdin)))')
            [ "$n" -gt 0 ] && break
            sleep 2
          done
          echo "sim-1 cabin_temp readings: $n"
          [ "$n" -gt 0 ]
          curl -fsS -o /dev/null http://127.0.0.1:18000/
          curl -fsS -o /dev/null http://127.0.0.1:18000/camera/
          docker compose -p habitat-ci logs hub > hub.log
          grep -q 'mqtt connected to broker:1883' hub.log
          for _ in $(seq 1 30); do
            s=$(count http://127.0.0.1:18100/ground/summary 'import json,sys; print(json.load(sys.stdin)["stored"])')
            [ "$s" -gt 0 ] && break
            sleep 2
          done
          echo "receiver stored: $s"
          [ "$s" -gt 0 ]
      - name: Logs on failure
        if: failure()
        run: docker compose -p habitat-ci --profile sim logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose -p habitat-ci --profile sim down -v

  # The same image for the Raspberry Pi 3 on 64-bit Raspberry Pi OS. The web stage runs natively;
  # the Python stage runs under QEMU. Built and loaded on the runner only, never pushed.
  docker-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: habitat-health-monitor:arm64
      - name: The arm64 image imports every package
        run: |
          docker run --rm --platform linux/arm64 habitat-health-monitor:arm64 \
            python -c "import platform, hub.api, hub.sim, linksim, receiver.app; print(platform.machine())"
